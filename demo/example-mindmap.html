<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkTrail Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #mindMapContainer { width: 100%; height: calc(100% - 36px); }
  .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; background: rgba(248,249,250,0.95); border-top: 1px solid #eee; z-index: 10; }
</style>
</head>
<body>
<div id="mindMapContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/simple-mind-map/dist/simpleMindMap.umd.min.js"></script>
<script>
(function(){
  var M = window.simpleMindMap;
  if (M && M.default && typeof M.default === 'function') { M = M.default; }
  if (typeof M !== 'function') { document.body.innerHTML = '<h1>Demo failed to load</h1>'; return; }
  var data = {
    data: { text: 'ThinkTrail Demo' },
    children: [
      { data: { text: 'How It Works' }, children: [
        { data: { text: 'Trigger /thinktrail in any Cowork session' } },
        { data: { text: 'Select which sessions to scan' } },
        { data: { text: 'AI extracts topic hierarchy from transcripts' } },
        { data: { text: 'Cross-session topics are merged semantically' } },
        { data: { text: 'Review and confirm the outline' } },
        { data: { text: 'Editable mindmap saved as HTML' } }
      ]},
      { data: { text: 'Features' }, children: [
        { data: { text: 'Double-click to edit any node' } },
        { data: { text: 'Drag to reorganize branches' } },
        { data: { text: 'Right-click for node menu' } },
        { data: { text: 'Incremental mode: only read new sessions' } },
        { data: { text: 'Full refresh mode: re-read everything' } }
      ]},
      { data: { text: 'Powered by SimpleMindMap (MIT)' }, children: [] }
    ]
  };
  new M({
    el: document.getElementById('mindMapContainer'),
    data: data,
    layout: 'logicalStructure',
    editable: true,
    draggable: true,
    enableFreeDrag: true,
    mousewheelAction: 'zoom'
  });
})();
</script>
<div class="footer">
  ThinkTrail Demo &nbsp;|&nbsp; github.com/fionapal/thinktrail
</div>
</body>
</html>
