<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITE 项目 · 思维轨迹 · ThinkTrail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #mindMapContainer { width: 100%; height: calc(100% - 36px); }
  .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; background: rgba(248,249,250,0.95); border-top: 1px solid #eee; z-index: 10; }
</style>
</head>
<body>
<div id="mindMapContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/simple-mind-map/dist/simpleMindMap.umd.min.js"></script>
<script>
(function(){
  var keys = Object.keys(window).filter(function(k){
    return k.toLowerCase().indexOf('mind')>-1 || k.toLowerCase().indexOf('simple')>-1 || k.toLowerCase().indexOf('map')>-1;
  });
  console.log('Relevant globals:', keys);
  // Show typeof for each
  keys.forEach(function(k){ console.log('  ' + k + ': ' + typeof window[k]); });

  var M = window.simpleMindMap || window.MindMap || window.mindMap;
  // Check for .default (common UMD pattern)
  if (M && M.default && typeof M.default === 'function') { M = M.default; console.log('Using .default'); }
  // Try other constructor patterns
  if (typeof M !== 'function') {
    for (var i=0; i<keys.length; i++) {
      var v = window[keys[i]];
      if (typeof v === 'function') { M = v; console.log('Found at window.' + keys[i]); break; }
      if (v && v.default && typeof v.default === 'function') { M = v.default; console.log('Found at window.' + keys[i] + '.default'); break; }
    }
  }
  if (typeof M !== 'function') {
    document.body.innerHTML = '<h1 style="padding:40px">No mindmap constructor found.<br>Globals: ' + JSON.stringify(keys) + '</h1>';
    return;
  }
  console.log('Constructor:', M.name || 'unnamed');

  var data = {
    data: { text: 'KITE 项目 · 思维轨迹' },
    children: [
      { data: { text: '[S1] 品牌命名与全项目更名' }, children: [
        { data: { text: '10候选→KITE：最轻，四字母，风筝有线就能飞' } },
        { data: { text: 'Vault：ai-self-media-2026→kite（11文件更新）' } },
        { data: { text: 'Workspace：AI自媒体2026→KITE2026\\KITE\\' } },
        { data: { text: 'CLAUDE.md / Memory 路径全量同步' } },
        { data: { text: '旧路径清除：两个空壳目录' } }
      ]},
      { data: { text: '[S1+S2] 双文件夹架构 · 文件夹即智能体' }, children: [
        { data: { text: '核心：目录结构=意图表达，agent通过路径理解边界' } },
        { data: { text: 'Vault=长期记忆/策略知识库' } },
        { data: { text: 'Workspace=工作台/内容+素材+prompts' } },
        { data: { text: '三条硬规则：不在vault创建草稿/编辑前读GOVERNANCE/删前问Fiona' } }
      ]},
      { data: { text: '[S1+S2] Stage 0 容器建设 · 不建内容' }, children: [
        { data: { text: '核心原则：建容器（积累），不建内容（不写未验证模板）' } },
        { data: { text: 'Agent Mode：读run-log→actions.md→提一个决策' } },
        { data: { text: 'run-log.md：从Day1积累，三个月后=最短上下文桥' } },
        { data: { text: '明确不该建：平台模板/格式prompt/品牌视觉/hook库' } }
      ]},
      { data: { text: '[S1] Cowork Project Instruction 设计' }, children: [
        { data: { text: 'Stage 0 / no accounts / no workflows validated' } },
        { data: { text: '四条hard constraints：不写空模板/不假装/直接反馈/一次一问' } }
      ]},
      { data: { text: '[S1] Vault 文档拆分与治理' }, children: [
        { data: { text: 'platform-strategy→5文件：launch-plan/content-pipeline/risks/actions' } },
        { data: { text: 'actions.md=唯一待办清单 / project-model-v4§8→一行引用' } }
      ]},
      { data: { text: '[S1+S2] CLAUDE.md 演进 + 遗留清理' }, children: [
        { data: { text: '从过时初版→完整桥梁文档（Agent Mode+Two-Folder表）' } },
        { data: { text: '待办来源切换：project-model-v4§8→actions.md' } },
        { data: { text: '截断行补全 / run-log旧路径清洗 / 三位置干净' } }
      ]},
      { data: { text: '[S3] 平台战略调研：微信 vs 小红书' }, children: [
        { data: { text: '核心决策：主战场微信。漏斗每步-30~50%，全链路≈0.2%' } },
        { data: { text: '胡润2026：XHS61%/视频号32%（U40+偏视频号）' } },
        { data: { text: '视频号：31-45岁最强/知识付费+120%/搜一搜商业SEO真空' } },
        { data: { text: 'XHS私域：2025.1私信通唯一合规/平台利益=站内闭环' } },
        { data: { text: 'Fiona反馈：不露脸/AI多平台转换/微信零资产冷启动' } }
      ]},
      { data: { text: '[S3] 四平台角色定义' }, children: [
        { data: { text: '贴图号：搜索拦截主力/日更短图文/2026新红利' } },
        { data: { text: '公众号：SEO资产+信任基石/双周长文' } },
        { data: { text: '视频号：深度信任/周更屏幕录制+原声' } },
        { data: { text: '小红书：辅助拦截/"去微信搜我名字"' } }
      ]},
      { data: { text: '[S3] 冷启动策略' }, children: [
        { data: { text: '贴图号优先：非露脸视频成本比图文高5-10倍' } },
        { data: { text: '纯冷启动→贴图号+搜一搜SEO效率最高' } },
        { data: { text: '"私信我"→"搜我名字"（用户主动找你）' } }
      ]},
      { data: { text: '[S3] 行业选择：制造业/工厂首发' }, children: [
        { data: { text: '搜一搜真空/老板年龄=微信使用率/ERP验证支付力' } },
        { data: { text: '认知差大/电商太卷[条件]' } }
      ]},
      { data: { text: '[S3] 非露脸信任与内容生产' }, children: [
        { data: { text: '不露脸不是弱点：卖认知差，内容是主角' } },
        { data: { text: '信任六支柱+内容三原则+AI管线四层' } },
        { data: { text: '反直觉：30-50老板不信任"高度制作化"=可信信号' } }
      ]},
      { data: { text: '[S3] 文档产出与待决策' }, children: [
        { data: { text: 'project-model-v4.md 第5/8/9章重写 + platform-strategy.md新建' } },
        { data: { text: '待决策：首发行业确认 / 品牌命名' } }
      ]}
    ]
  };

  try {
    var mindMap = new M({
      el: document.getElementById('mindMapContainer'),
      data: data,
      layout: 'logicalStructure',
      editable: true,
      draggable: true,
      enableFreeDrag: true,
      mousewheelAction: 'zoom'
    });
    console.log('MindMap created successfully');
  } catch(e) {
    console.error('Error:', e.message, e.stack);
    document.body.innerHTML += '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border:1px solid red;z-index:999">Error: ' + e.message + '</div>';
  }
})();
</script>
<div class="footer">
  KITE 项目 · 思维轨迹 &nbsp;|&nbsp; 3 sessions &nbsp;|&nbsp; 2026-05-21 &nbsp;|&nbsp; ThinkTrail
</div>
</body>
</html>
